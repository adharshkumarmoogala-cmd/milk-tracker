<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satyavathy Goshala — Milk Tracker</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#2c2a26; --sub:#6b6558;
    --accent:#7a8c5b; --accent-soft:#e7ecdd; --line:#e4dfd3;
    --danger:#b5654a; --warn:#a17d2c; --radius:14px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1b18; --card:#26241f; --ink:#eee9df; --sub:#a39c8c;
      --accent:#9ab27a; --accent-soft:#333a29; --line:#38352c; --warn:#d9b25f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1b18; --card:#26241f; --ink:#eee9df; --sub:#a39c8c;
    --accent:#9ab27a; --accent-soft:#333a29; --line:#38352c; --warn:#d9b25f;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header{text-align:center;margin-bottom:14px;}
  header h1{font-size:1.35rem;margin:0 0 2px;font-weight:600;}
  header p{margin:0;color:var(--sub);font-size:0.88rem;}
  .banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:0.8rem;color:var(--sub);text-align:center;margin-bottom:14px;}
  .banner.warn{background:transparent;border-color:var(--warn);color:var(--warn);}
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:16px;overflow-x:auto;}
  .tab{flex:1;text-align:center;padding:9px 8px;border-radius:9px;font-size:0.86rem;
    cursor:pointer;color:var(--sub);white-space:nowrap;user-select:none;}
  .tab.active{background:var(--accent);color:#fff;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;text-align:center;}
  .card .num{font-size:1.6rem;font-weight:700;color:var(--accent);}
  .card .lbl{font-size:0.78rem;color:var(--sub);margin-top:2px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;margin-bottom:16px;}
  .panel h3{margin:0 0 12px;font-size:0.95rem;color:var(--sub);font-weight:600;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:0.82rem;}
  .bar-tag{width:64px;flex-shrink:0;color:var(--sub);text-align:right;}
  .bar-track{flex:1;background:var(--accent-soft);border-radius:6px;height:16px;overflow:hidden;}
  .bar-fill{background:var(--accent);height:100%;border-radius:6px;transition:width .3s;}
  .bar-val{width:52px;flex-shrink:0;font-weight:600;}
  .empty{color:var(--sub);font-size:0.85rem;text-align:center;padding:14px 0;}
  form{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  form .full{grid-column:1/-1;}
  label{font-size:0.76rem;color:var(--sub);display:block;margin-bottom:3px;}
  input,select,textarea{width:100%;padding:8px 9px;border:1px solid var(--line);
    border-radius:8px;background:var(--bg);color:var(--ink);font-size:0.88rem;font-family:inherit;}
  textarea{resize:vertical;min-height:38px;}
  .btn{padding:9px 14px;border:none;border-radius:8px;background:var(--accent);color:#fff;
    font-size:0.86rem;cursor:pointer;font-weight:600;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn.secondary{background:var(--accent-soft);color:var(--ink);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .row-actions{display:flex;gap:6px;}
  table{width:100%;border-collapse:collapse;font-size:0.82rem;}
  .table-wrap{overflow-x:auto;}
  th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{color:var(--sub);font-weight:600;font-size:0.74rem;text-transform:uppercase;}
  .note-cell{white-space:normal;max-width:140px;color:var(--sub);}
  .session-tag{padding:2px 7px;border-radius:20px;font-size:0.7rem;font-weight:600;}
  .session-tag.morning{background:#f3e4c0;color:#7a5a1a;}
  .session-tag.evening{background:#dfe1ee;color:#3f4a7a;}
  :root[data-theme="dark"] .session-tag.morning,
  :root:not([data-theme="light"]) .session-tag.morning{background:#4a3d1f;color:#e8cf8f;}
  :root[data-theme="dark"] .session-tag.evening,
  :root:not([data-theme="light"]) .session-tag.evening{background:#2b2f42;color:#b7bde0;}
  .logo{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--line);background:#fff;}
  .brand-row{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:2px;}
  .reminder-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .reminder-row .field{flex:1;min-width:140px;}
  .reminder-block{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .reminder-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .muted-note{font-size:0.78rem;color:var(--sub);margin-top:8px;line-height:1.4;}
  .copy-box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:0.8rem;color:var(--sub);margin-top:8px;white-space:pre-wrap;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>

<script>
// ==== Shared backend: Google Apps Script Web App over a Google Sheet ====
// Paste the deployed Apps Script Web App URL (ends in /exec) here.
const API_URL = "https://script.google.com/macros/s/AKfycbwD7nWZptrKVyroG77iTXec1Y2L4GYRKPOTbnMx7fYTgzvwsF1TvRVNYLTHQmI6bb84/exec";

let entries = [];
let activeTab = "manage";
let editingId = null;
let loaded = false;
let apiOk = null; // null = unknown, true/false = known
let refreshTimer = null;
let saving = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

const TABS = [
  {id:"manage", label:"📝 Manage"},
  {id:"morning", label:"☀️ Morning"},
  {id:"evening", label:"🌙 Evening"},
  {id:"combined", label:"📊 Combined"},
  {id:"reminders", label:"⏰ Reminders"},
  {id:"export", label:"⬇️ Export"}
];

let downloadsCap = null;

const REMINDER_PREFS_KEY = "goshala_reminder_prefs_v1";
function loadReminderPrefs(){
  try{
    const raw = localStorage.getItem(REMINDER_PREFS_KEY);
    return raw ? JSON.parse(raw) : {morningTime:"06:30", eveningTime:"18:30"};
  }catch(e){ return {morningTime:"06:30", eveningTime:"18:30"}; }
}
function saveReminderPrefs(p){
  try{ localStorage.setItem(REMINDER_PREFS_KEY, JSON.stringify(p)); }catch(e){}
}

function pad2(n){ return String(n).padStart(2,"0"); }
function fmtGCalDate(d){
  return `${d.getFullYear()}${pad2(d.getMonth()+1)}${pad2(d.getDate())}T${pad2(d.getHours())}${pad2(d.getMinutes())}00`;
}
function buildGCalUrl(title, timeStr, details){
  const [hh, mm] = timeStr.split(":").map(Number);
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0);
  const end = new Date(start.getTime() + 15*60000);
  const params = new URLSearchParams({
    action: "TEMPLATE",
    text: title,
    dates: fmtGCalDate(start) + "/" + fmtGCalDate(end),
    details: details,
    recur: "RRULE:FREQ=DAILY"
  });
  return "https://calendar.google.com/calendar/render?" + params.toString();
}

function apiConfigured(){
  return API_URL && API_URL.indexOf("PASTE_YOUR_APPS_SCRIPT") === -1;
}

async function apiList(){
  const res = await fetch(API_URL + "?action=list", { method: "GET" });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "Unknown API error");
  return json.entries || [];
}
async function apiAdd(data){
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "add", ...data })
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "Add failed");
  return json;
}
async function apiUpdate(id, data){
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "update", id, ...data })
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "Update failed");
  return json;
}
async function apiDelete(id){
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action: "delete", id })
  });
  const json = await res.json();
  if(!json.ok) throw new Error(json.error || "Delete failed");
  return json;
}

async function refreshEntries(silent){
  if(!apiConfigured()){ loaded = true; apiOk = false; render(); return; }
  try{
    const list = await apiList();
    entries = list.map(e => ({
      id: e.id, date: e.date, session: e.session, cowTag: e.cowTag,
      litres: Number(e.litres || 0), note: e.note || ""
    }));
    apiOk = true;
    loaded = true;
    if(!silent) render(); else if(activeTab !== "manage" || !editingId) render();
  }catch(err){
    console.error("Refresh failed", err);
    apiOk = false;
    loaded = true;
    render();
  }
}

function startAutoRefresh(){
  if(refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(()=>{ if(!saving) refreshEntries(true); }, 15000);
}

function renderBanner(){
  const el = document.getElementById("statusBanner");
  if(!apiConfigured()){
    el.innerHTML = `<div class="banner warn">This tracker isn't connected to its shared Google Sheet yet. The owner needs to paste the Apps Script Web App URL into the page's API_URL setting.</div>`;
  } else if(apiOk === false){
    el.innerHTML = `<div class="banner warn">Couldn't reach the shared Google Sheet right now. Check your internet connection, or try refreshing.</div>`;
  } else {
    el.innerHTML = `<div class="banner">Data is stored in a shared Google Sheet. Anyone with this link can view, add, edit, and delete entries — no sign-in required.</div>`;
  }
}

function renderTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = TABS.map(tab=>
    `<div class="tab ${activeTab===tab.id?'active':''}" data-tab="${tab.id}">${tab.label}</div>`
  ).join("");
  t.querySelectorAll(".tab").forEach(el=>{
    el.onclick = ()=>{ activeTab = el.dataset.tab; editingId=null; render(); };
  });
}

function filteredEntries(session){
  if(session==="combined") return entries;
  return entries.filter(e=>e.session===session);
}
function summarize(list){
  const totalLitres = list.reduce((s,e)=>s+Number(e.litres||0),0);
  const cows = new Set(list.map(e=>e.cowTag)).size;
  return {totalLitres, cows};
}
function aggByCow(list){
  const map = {};
  list.forEach(e=>{ map[e.cowTag] = (map[e.cowTag]||0) + Number(e.litres||0); });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

function csvEscape(v){
  const s = String(v == null ? "" : v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function csvRow(arr){ return arr.map(csvEscape).join(",") + "\r\n"; }

function inRange(dateStr, from, to){
  if(from && dateStr < from) return false;
  if(to && dateStr > to) return false;
  return true;
}

function buildExportTable({sessionScope, reportType, fromDate, toDate}){
  let list = entries.filter(e => inRange(e.date || "", fromDate, toDate));
  if(sessionScope !== "combined"){
    list = list.filter(e => e.session === sessionScope);
  }

  if(reportType === "detailed"){
    const headers = ["Date","Session","Cow Tag Number","Number of Litres","Note"];
    const rows = list.slice().sort((a,b)=> (a.date||"").localeCompare(b.date||"")).map(e=>[
      e.date||"", e.session==='morning'?'Morning':'Evening', e.cowTag, Number(e.litres||0).toFixed(1), e.note||""
    ]);
    const totalLitres = list.reduce((s,e)=>s+Number(e.litres||0),0);
    const totalCows = new Set(list.map(e=>e.cowTag)).size;
    return { headers, rows, summaryLine: `Entries: ${list.length} · Cows recorded: ${totalCows} · Total litres: ${totalLitres.toFixed(1)} L` };
  }

  // Daily summary
  const byDate = {};
  list.forEach(e=>{
    const d = e.date || "Unknown";
    if(!byDate[d]) byDate[d] = { morningLitres:0, morningCows:new Set(), eveningLitres:0, eveningCows:new Set(), allCows:new Set() };
    const litres = Number(e.litres||0);
    byDate[d].allCows.add(e.cowTag);
    if(e.session === "morning"){
      byDate[d].morningLitres += litres;
      byDate[d].morningCows.add(e.cowTag);
    } else {
      byDate[d].eveningLitres += litres;
      byDate[d].eveningCows.add(e.cowTag);
    }
  });
  const dates = Object.keys(byDate).sort();
  let headers, rows;
  let grandTotalLitres = 0;
  const grandCows = new Set();

  if(sessionScope === "combined"){
    headers = ["Date","Morning Cows","Morning Litres","Evening Cows","Evening Litres","Total Cows","Total Litres"];
    rows = dates.map(d=>{
      const r = byDate[d];
      const totalLitres = r.morningLitres + r.eveningLitres;
      grandTotalLitres += totalLitres;
      r.allCows.forEach(c=>grandCows.add(c));
      return [d, r.morningCows.size, r.morningLitres.toFixed(1), r.eveningCows.size, r.eveningLitres.toFixed(1), r.allCows.size, totalLitres.toFixed(1)];
    });
  } else {
    const label = sessionScope === "morning" ? "Morning" : "Evening";
    headers = ["Date", `${label} Cows`, `${label} Litres`];
    rows = dates.map(d=>{
      const r = byDate[d];
      const cows = sessionScope === "morning" ? r.morningCows.size : r.eveningCows.size;
      const litres = sessionScope === "morning" ? r.morningLitres : r.eveningLitres;
      grandTotalLitres += litres;
      (sessionScope === "morning" ? r.morningCows : r.eveningCows).forEach(c=>grandCows.add(c));
      return [d, cows, litres.toFixed(1)];
    });
  }
  return { headers, rows, summaryLine: `Days: ${dates.length} · Cows recorded: ${grandCows.size} · Total litres: ${grandTotalLitres.toFixed(1)} L` };
}

function buildExportCsv(opts){
  const { headers, rows, summaryLine } = buildExportTable(opts);
  let csv = csvRow(headers);
  rows.forEach(r => csv += csvRow(r));
  csv += csvRow([]) + csvRow([summaryLine]);
  return csv;
}

function exportTitleParts({sessionScope, reportType, fromDate, toDate}){
  const scopeLabel = sessionScope === "combined" ? "Combined (Morning + Evening)" : (sessionScope === "morning" ? "Morning" : "Evening");
  const typeLabel = reportType === "daily" ? "Daily Totals" : "Detailed Entries";
  const rangeLabel = (fromDate || toDate) ? `${fromDate||"start"} to ${toDate||"today"}` : "All time";
  return { scopeLabel, typeLabel, rangeLabel };
}

function buildExportFilename({sessionScope, reportType, fromDate, toDate}, ext){
  const scopeLabel = sessionScope === "combined" ? "Combined" : (sessionScope === "morning" ? "Morning" : "Evening");
  const typeLabel = reportType === "daily" ? "DailyTotals" : "Detailed";
  const rangeLabel = (fromDate || toDate) ? `_${fromDate||"start"}_to_${toDate||"now"}` : "_AllTime";
  return `Satyavathy_Goshala_${scopeLabel}_${typeLabel}${rangeLabel}.${ext}`;
}

async function buildExportPdfBlob(opts){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: "landscape", unit: "pt" });
  const { headers, rows, summaryLine } = buildExportTable(opts);
  const { scopeLabel, typeLabel, rangeLabel } = exportTitleParts(opts);

  doc.setFontSize(16);
  doc.text("Satyavathy Goshala — Milk Production Report", 40, 40);
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text(`${typeLabel}  ·  ${scopeLabel}  ·  Period: ${rangeLabel}`, 40, 58);
  doc.text(`Generated ${new Date().toLocaleString()}`, 40, 72);

  doc.autoTable({
    head: [headers],
    body: rows,
    startY: 88,
    styles: { fontSize: 9, cellPadding: 5 },
    headStyles: { fillColor: [122, 140, 91] },
    alternateRowStyles: { fillColor: [247, 245, 240] },
    foot: [[{content: summaryLine, colSpan: headers.length}]],
    footStyles: { fillColor: [231, 236, 221], textColor: [44,42,38], fontStyle: "bold" }
  });

  return doc.output("blob");
}

function renderSummaryView(session, title){
  const list = filteredEntries(session);
  const {totalLitres, cows} = summarize(list);
  const agg = aggByCow(list);
  const max = agg.length ? agg[0][1] : 0;
  let bars = agg.length ? agg.map(([tag,litres])=>`
    <div class="bar-row">
      <div class="bar-tag">${tag}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${max?Math.max(4,(litres/max*100)):0}%"></div></div>
      <div class="bar-val">${litres.toFixed(1)} L</div>
    </div>`).join("") : `<div class="empty">No entries yet.</div>`;
  return `
    <div class="cards">
      <div class="card"><div class="num">${cows}</div><div class="lbl">Number of Cows</div></div>
      <div class="card"><div class="num">${totalLitres.toFixed(1)}</div><div class="lbl">Total Litres (${title})</div></div>
    </div>
    <div class="panel">
      <h3>Litres by Cow — ${title}</h3>
      ${bars}
    </div>
  `;
}

function renderManageView(){
  const canAct = apiConfigured();
  const rows = entries.slice().sort((a,b)=> (b.date||"").localeCompare(a.date||""))
    .map(e=>`
      <tr>
        <td>${e.date||""}</td>
        <td><span class="session-tag ${e.session}">${e.session==='morning'?'Morning':'Evening'}</span></td>
        <td>${e.cowTag}</td>
        <td>${Number(e.litres).toFixed(1)}</td>
        <td class="note-cell">${(e.note||"").replace(/</g,"&lt;")}</td>
        <td>
          <div class="row-actions">
            <button class="btn secondary" style="padding:5px 9px;font-size:0.75rem" ${canAct?'':'disabled'} onclick="startEdit('${e.id}')">Edit</button>
            <button class="btn danger" style="padding:5px 9px;font-size:0.75rem" ${canAct?'':'disabled'} onclick="deleteEntry('${e.id}')">Delete</button>
          </div>
        </td>
      </tr>`).join("");

  const edit = editingId ? entries.find(e=>e.id===editingId) : null;

  return `
    <div class="panel">
      <h3>${edit ? "Edit Entry" : "Add Entry"}</h3>
      <form id="entryForm">
        <div><label>Date</label><input type="date" name="date" value="${edit?edit.date:new Date().toISOString().slice(0,10)}" required></div>
        <div><label>Session</label>
          <select name="session">
            <option value="morning" ${edit&&edit.session==='morning'?'selected':''}>Morning</option>
            <option value="evening" ${edit&&edit.session==='evening'?'selected':''}>Evening</option>
          </select>
        </div>
        <div><label>Cow Tag Number</label><input type="text" name="cowTag" value="${edit?edit.cowTag:''}" placeholder="e.g. C-014" required></div>
        <div><label>Number of Litres</label><input type="number" step="0.1" min="0" name="litres" value="${edit?edit.litres:''}" required></div>
        <div class="full"><label>Note</label><textarea name="note" placeholder="Optional note">${edit?edit.note||'':''}</textarea></div>
        <div class="full row-actions">
          <button type="submit" class="btn" ${canAct?'':'disabled'}>${edit?"Save Changes":"Add Entry"}</button>
          ${edit?'<button type="button" class="btn secondary" onclick="cancelEdit()">Cancel</button>':''}
        </div>
      </form>
    </div>
    <div class="panel">
      <div class="row-actions" style="justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0">All Entries (${entries.length})</h3>
        <button type="button" class="btn secondary" id="refreshBtn" style="padding:6px 12px;font-size:0.78rem">Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Session</th><th>Cow Tag</th><th>Litres</th><th>Note</th><th></th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" class="empty">No entries yet — add your first one above.</td></tr>'}</tbody>
        </table>
      </div>
    </div>
  `;
}

  const p = loadReminderPrefs();
  return `
    <div class="panel">
      <h3>Daily Milking Reminders</h3>
      <p class="muted-note" style="margin-top:0">
        This is a shared web page, so it can't send phone push notifications by itself.
        The reliable way to get a daily alert on your phone is to add a recurring event
        to your own calendar app below — it takes one tap and repeats every day automatically.
      </p>

      <div class="reminder-block">

            <label>Reminder time</label>
            <input type="time" id="morningTime" value="${p.morningTime}">
          </div>
          <button class="btn" id="addMorningGCal">Add to Google Calendar</button>
        </div>
      </div>

      <div class="reminder-block">
        <strong>🌙 Evening Milking</strong>
        <div class="reminder-row" style="margin-top:8px">
          <div class="field">
            <label>Reminder time</label>
            <input type="time" id="eveningTime" value="${p.eveningTime}">
          </div>

      <div class="reminder-block">

        <p class="muted-note">Copy these details and create a daily recurring reminder in your app of choice:</p>
        <div class="copy-box" id="manualReminderText"></div>

        </div>

function renderExportView(){
  const canDownload = downloadsCap !== null;
  return `
    <div class="panel">
      <h3>Download Data Sheet</h3>
      <p class="muted-note" style="margin-top:0">
        Export the tracker's data as a CSV file you can open in Excel, Google Sheets, or Numbers.
      </p>
      <form id="exportForm">
        <div class="full">
          <label>Which output</label>
          <select name="sessionScope">
            <option value="combined">Combined (Morning + Evening)</option>
            <option value="morning">Morning only</option>
            <option value="evening">Evening only</option>
          </select>
        </div>
        <div class="full">
          <label>Report type</label>
          <select name="reportType">
            <option value="daily">Daily totals (one row per day)</option>
            <option value="detailed">Detailed entries (every log entry)</option>
          </select>
        </div>
        <div>
          <label>From date (optional)</label>
          <input type="date" name="fromDate">
        </div>
        <div>
          <label>To date (optional)</label>
          <input type="date" name="toDate">
        </div>
        <div class="full row-actions">
          <button type="submit" class="btn" ${canDownload?'':'disabled'}>Download CSV</button>
          <button type="button" id="downloadPdfBtn" class="btn secondary" ${canDownload?'':'disabled'}>Download PDF</button>
        </div>
        ${canDownload?'':'<div class="muted-note">Downloads aren\'t available in this view.</div>'}
      </form>
    </div>
  `;
}

function render(){
  renderBanner();
  renderTabs();
  const v = document.getElementById("view");
  if(!loaded){ v.innerHTML = `<div class="empty">Loading shared data…</div>`; return; }
  if(activeTab==="morning") v.innerHTML = renderSummaryView("morning","Morning");
  else if(activeTab==="evening") v.innerHTML = renderSummaryView("evening","Evening");
  else if(activeTab==="combined") v.innerHTML = renderSummaryView("combined","Combined (All-Time)");
  else if(activeTab==="reminders") v.innerHTML = renderRemindersView();
  else if(activeTab==="export") v.innerHTML = renderExportView();
  else v.innerHTML = renderManageView();

  const form = document.getElementById("entryForm");
  if(form){
    form.onsubmit = async (ev)=>{
      ev.preventDefault();
      if(!apiConfigured()) return;
      const fd = new FormData(form);
      const data = {
        date: fd.get("date"), session: fd.get("session"),
        cowTag: fd.get("cowTag").trim(), litres: parseFloat(fd.get("litres")),
        note: fd.get("note").trim()
      };
      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      saving = true;
      try{
        if(editingId){
          await apiUpdate(editingId, data);
          editingId = null;
        } else {
          await apiAdd(data);
        }
        await refreshEntries(true);
      }catch(e){
        console.error("Write failed", e);
        apiOk = false;
      }
      saving = false;
      submitBtn.disabled = false;
      render();
    };
  }

  const refreshBtn = document.getElementById("refreshBtn");
  if(refreshBtn){
    refreshBtn.onclick = async ()=>{
      refreshBtn.disabled = true;
      const orig = refreshBtn.textContent;
      refreshBtn.textContent = "Refreshing…";
      await refreshEntries(false);
      refreshBtn.textContent = orig;
      refreshBtn.disabled = false;
    };
  }

  if(activeTab === "reminders"){
    const morningInput = document.getElementById("morningTime");
    const eveningInput = document.getElementById("eveningTime");
    const manualBox = document.getElementById("manualReminderText");

    function updateManualText(){
      const p = { morningTime: morningInput.value, eveningTime: eveningInput.value };
      saveReminderPrefs(p);
      manualBox.textContent =
        `Satyavathy Goshala — Morning Milking\nDaily at ${p.morningTime}, repeats every day\n\n` +
        `Satyavathy Goshala — Evening Milking\nDaily at ${p.eveningTime}, repeats every day`;
    }
    updateManualText();
    morningInput.addEventListener("change", updateManualText);
    eveningInput.addEventListener("change", updateManualText);

    document.getElementById("addMorningGCal").onclick = ()=>{
      const p = loadReminderPrefs();
      p.morningTime = morningInput.value;
      saveReminderPrefs(p);
      const url = buildGCalUrl(
        "Satyavathy Goshala — Morning Milking",
        morningInput.value,
        "Log this morning's milk production in the Satyavathy Goshala tracker."
      );
      window.open(url, "_blank", "noopener");
    };
    document.getElementById("addEveningGCal").onclick = ()=>{
      const p = loadReminderPrefs();
      p.eveningTime = eveningInput.value;
      saveReminderPrefs(p);
      const url = buildGCalUrl(
        "Satyavathy Goshala — Evening Milking",
        eveningInput.value,
        "Log this evening's milk production in the Satyavathy Goshala tracker."
      );
      window.open(url, "_blank", "noopener");
    };
    document.getElementById("copyReminderText").onclick = async ()=>{
      const btn = document.getElementById("copyReminderText");
      try{
        await navigator.clipboard.writeText(manualBox.textContent);
        const orig = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(()=>{ btn.textContent = orig; }, 1500);
      }catch(e){
        console.error("Copy failed", e);
      }
    };
  }

  const exportForm = document.getElementById("exportForm");
  if(exportForm){
    exportForm.onsubmit = async (ev)=>{
      ev.preventDefault();
      if(!downloadsCap) return;
      const fd = new FormData(exportForm);
      const sessionScope = fd.get("sessionScope");
      const reportType = fd.get("reportType");
      const fromDate = fd.get("fromDate") || "";
      const toDate = fd.get("toDate") || "";

      const csv = buildExportCsv({sessionScope, reportType, fromDate, toDate});
      const filename = buildExportFilename({sessionScope, reportType, fromDate, toDate}, "csv");

      const submitBtn = exportForm.querySelector('button[type="submit"]');
      const orig = submitBtn.textContent;
      submitBtn.disabled = true;
      try{
        const result = await downloadsCap.save({ filename, data: csv });
        submitBtn.textContent = result.status === "saved" ? "Downloaded!" : "Delivered!";
      }catch(e){
        console.error("Download failed", e);
        submitBtn.textContent = (e && e.code === "declined") ? "Cancelled" : "Download failed";
      }
      setTimeout(()=>{ submitBtn.textContent = orig; submitBtn.disabled = false; }, 1800);
    };

    const pdfBtn = document.getElementById("downloadPdfBtn");
    if(pdfBtn){
      pdfBtn.onclick = async ()=>{
        if(!downloadsCap) return;
        const fd = new FormData(exportForm);
        const opts = {
          sessionScope: fd.get("sessionScope"),
          reportType: fd.get("reportType"),
          fromDate: fd.get("fromDate") || "",
          toDate: fd.get("toDate") || ""
        };
        const filename = buildExportFilename(opts, "pdf");
        const orig = pdfBtn.textContent;
        pdfBtn.disabled = true;
        pdfBtn.textContent = "Building…";
        try{
          if(!window.jspdf || !window.jspdf.jsPDF){
            throw new Error("PDF library not loaded");
          }
          const blob = await buildExportPdfBlob(opts);
          const result = await downloadsCap.save({ filename, data: blob });
          pdfBtn.textContent = result.status === "saved" ? "Downloaded!" : "Delivered!";
        }catch(e){
          console.error("PDF download failed", e);
          pdfBtn.textContent = (e && e.code === "declined") ? "Cancelled" : "PDF failed";
        }
        setTimeout(()=>{ pdfBtn.textContent = orig; pdfBtn.disabled = false; }, 1800);
      };
    }
  }
}

function startEdit(id){ editingId = id; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function cancelEdit(){ editingId = null; render(); }
async function deleteEntry(id){
  if(!apiConfigured()) return;
  saving = true;
  try{
    await apiDelete(id);
    await refreshEntries(true);
  }catch(e){
    console.error("Delete failed", e);
    apiOk = false;
    render();
  }
  saving = false;
}

async function init(){
  try{ downloadsCap = await claude.use("downloads"); }catch(e){ downloadsCap = null; }
  await refreshEntries(false);
  startAutoRefresh();
}

render();
init();
</script>
